limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/mime.types;
  types { text/javascript mjs; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  client_max_body_size 11m;
  client_body_timeout 15s;
  client_header_timeout 15s;

  error_page 413 = @too_large;
  error_page 429 = @rate_limited;
  location @too_large {
    default_type application/problem+json;
    return 413 '{"type":"about:blank","title":"Payload Too Large","status":413,"detail":"Uploaded file is too large."}';
  }
  location @rate_limited {
    default_type application/problem+json;
    return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many requests, slow down."}';
  }

  resolver 127.0.0.11 valid=10s ipv6=off;

  error_page 502 503 504 = @backend_unavailable;
  location @backend_unavailable {
    default_type application/problem+json;
    return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"The detection service is not available."}';
  }

  location /api/ {
    limit_req zone=api burst=10 nodelay;
    limit_req_status 429;
    set $backend_upstream http://backend:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend_upstream;
    proxy_read_timeout 60s;
    proxy_set_header X-Request-Id $request_id;
  }

  location / {
    try_files $uri /index.html;
  }
}
